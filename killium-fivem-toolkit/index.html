<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Killium FiveM Toolkit</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0e10;--bg2:#131418;--bg3:#1a1b1f;--bg4:#222328;--bg5:#2a2b30;
  --line:#272830;--line2:#333440;
  --text:#e6e7eb;--text2:#8f909e;--text3:#52535f;
  --accent:#f5a623;--accent2:#e8961a;
  --blue:#4a9eff;--green:#3ecf8e;--red:#ff5252;--purple:#a78bfa;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text);overflow:hidden}
.shell{display:flex;flex-direction:column;height:100vh}

/* top bar */
.topbar{display:flex;align-items:center;gap:14px;padding:0 18px;height:52px;border-bottom:1px solid var(--line);background:var(--bg2);flex-shrink:0;z-index:50}
.logo{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;white-space:nowrap}
.logo i{color:var(--accent);font-size:19px}
.logo-tag{background:var(--accent);color:#000;font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px}

/* app switcher tabs */
.switcher{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--line2);border-radius:8px;padding:3px;margin-left:8px}
.sw-tab{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text2);padding:6px 13px;border-radius:6px;cursor:pointer;transition:.15s;user-select:none;border:1px solid transparent}
.sw-tab i{font-size:14px}
.sw-tab:hover{color:var(--text);background:var(--bg4)}
.sw-tab.on{color:#000;background:var(--accent)}
.sw-tab.on i{color:#000}

.top-spacer{flex:1}
.env-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--line2);border-radius:5px;padding:4px 9px;white-space:nowrap}
.env-chip i{font-size:12px;color:var(--accent)}

/* frame area */
.frames{position:relative;flex:1;overflow:hidden;background:var(--bg)}
.frame-view{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .12s ease}
.frame-view.on{opacity:1;pointer-events:auto}
iframe{width:100%;height:100%;border:none;display:block;background:var(--bg)}

/* first-load splash */
.boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:5;flex-direction:column;gap:10px;transition:opacity .25s ease}
.boot.hide{opacity:0;pointer-events:none}
.boot i{font-size:26px;color:var(--accent);animation:spin 1s linear infinite}
.boot span{font-size:12px;color:var(--text2)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="logo"><i class="ti ti-car"></i>Killium <span class="logo-tag">FIVEM</span></div>

    <div class="switcher" role="tablist">
      <div class="sw-tab on" id="tab-car" onclick="switchApp('car')" role="tab" aria-selected="true">
        <i class="ti ti-car"></i>Car Manager
      </div>
      <div class="sw-tab" id="tab-merge" onclick="switchApp('merge')" role="tab" aria-selected="false">
        <i class="ti ti-git-merge"></i>Engine File Merger
      </div>
    </div>

    <div class="top-spacer"></div>
    <div class="env-chip"><i class="ti ti-bolt"></i>Toolkit v1.0</div>
  </div>

  <div class="frames">
    <div class="frame-view on" id="view-car">
      <div class="boot" id="boot-car"><i class="ti ti-loader-2"></i><span>Loading Car Manager…</span></div>
      <iframe id="frame-car" src="car-tool.html" title="Killium FiveM Car Manager" onload="hideBoot('car')"></iframe>
    </div>
    <div class="frame-view" id="view-merge">
      <div class="boot" id="boot-merge"><i class="ti ti-loader-2"></i><span>Loading Engine File Merger…</span></div>
      <iframe id="frame-merge" src="merger-tool.html" title="FiveM Engine File Merger" onload="hideBoot('merge')"></iframe>
    </div>
  </div>

</div>

<script>
function switchApp(name){
  document.getElementById('tab-car').classList.toggle('on', name==='car');
  document.getElementById('tab-merge').classList.toggle('on', name==='merge');
  document.getElementById('tab-car').setAttribute('aria-selected', name==='car');
  document.getElementById('tab-merge').setAttribute('aria-selected', name==='merge');
  document.getElementById('view-car').classList.toggle('on', name==='car');
  document.getElementById('view-merge').classList.toggle('on', name==='merge');
}
function hideBoot(name){
  const b = document.getElementById('boot-'+name);
  if(b){ b.classList.add('hide'); setTimeout(()=>b.remove(), 300); }
}
</script>
</body>
</html>
